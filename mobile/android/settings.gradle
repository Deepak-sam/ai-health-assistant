// Resolves Flutter's own Gradle plugin (dev.flutter.flutter-gradle-plugin,
// applied in app/build.gradle) from the Flutter SDK path in local.properties
// — the standard mechanism Flutter's tooling relies on regardless of SDK
// version. `local.properties` itself is gitignored/machine-specific; copy
// local.properties.example and fill in real paths before building.
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

include ":app"
