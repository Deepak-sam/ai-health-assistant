name: family_health_assistant
description: >
  Private family AI health assistant — Phase 1 mobile app. Chat-first,
  local-first health tracking with deterministic on-device analytics.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local database (source of truth per ARCHITECTURE.md §9)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1

  # Secure storage for auth tokens (never in Drift tables)
  flutter_secure_storage: ^9.2.2

  # Firebase (Auth + FCM per ARCHITECTURE.md §1, §18)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Local notifications for on-device alert firing (ARCHITECTURE.md §10:
  # AlertRuleEvaluator "triggers a local notification" on a rule breach —
  # not part of the suggested list but required to implement that behavior).
  flutter_local_notifications: ^17.2.2

  # Health Connect / HealthKit (ARCHITECTURE.md §7)
  health: ^10.2.0

  # Nutrition photo capture (ARCHITECTURE.md §8 — in-memory only, never disk)
  image_picker: ^1.1.2

  # Charts (History/Insights)
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3 # PKCE code_challenge (S256) for Garmin OAuth
  webview_flutter: ^4.8.0 # Garmin OAuth consent screen

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.7

  flutter_lints: ^4.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  # No bundled assets yet — add an `assets:` section here once there are
  # real files to list (an empty directory entry can trip up some Flutter
  # tooling versions).
